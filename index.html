<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tuffyred.com</title>
  <meta name="description" content="Tuffyred LLC — apps that knock 'em dead.">
  <link rel="canonical" href="https://tuffyred.com/">
  <link rel="icon" href="assets/images/tuffyred-can-logo.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    .tr-home * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #ffffff; }
    .tr-home {
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      max-width: 680px;
      margin: 0 auto;
      padding: 3rem 1.5rem 4rem;
    }
    .tr-hero {
      display: flex;
      justify-content: center;
      padding-bottom: 3rem;
    }
    .tr-hero img {
      width: 260px;
      height: auto;
    }
    .tr-card {
      display: flex;
      gap: 1.25rem;
      align-items: flex-start;
      border: 1px solid #e5e0d8;
      border-radius: 16px;
      padding: 1.25rem 1.5rem;
      background: #ffffff;
      cursor: pointer;
    }
    .tr-icon {
      width: 80px;
      height: 80px;
      border-radius: 18px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .tr-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .tr-app-name {
      font-family: 'Archivo Black', 'Arial Black', sans-serif;
      font-size: 18px;
      color: #1C1C1C;
      margin-bottom: 4px;
      text-decoration: none;
      display: inline-block;
    }
    .tr-app-name:hover { color: #C23B2C; }
    .tr-app-desc {
      font-size: 14px;
      color: #9A9384;
      line-height: 1.55;
      margin-bottom: 12px;
    }
    .tr-badges { display: flex; gap: 8px; flex-wrap: wrap; }
    .tr-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      color: #1C1C1C;
      text-decoration: none;
    }
    .tr-badge:hover { background: #f5f0e8; }
    .tr-badge-soon { opacity: 0.45; cursor: default; }
    .tr-badge-soon:hover { background: none; }
    .tr-footer {
      text-align: center;
      margin-top: 3rem;
      font-size: 12px;
      color: #9A9384;
    }
    .tr-footer a {
      color: #9A9384;
      text-decoration: none;
      margin: 0 6px;
    }
    .tr-footer a:hover { color: #C23B2C; }
  </style>
</head>
<body>
  <div class="tr-home">
    <div class="tr-hero">
      <img decoding="async" src="assets/images/tuffyred-can-logo.jpg" alt="Tuffyred — Knock 'Em Dead">
    </div>
    <div class="tr-card">
      <div class="tr-icon">
        <img decoding="async" src="assets/images/verbi-brutali-icon.png" alt="Verbi Brutali app icon">
      </div>
      <div>
        <a href="verbi-brutali/" class="tr-app-name">Verbi Brutali</a>
        <p class="tr-app-desc">Master Italian verb conjugations.</p>
        <div class="tr-badges">
          <span class="tr-badge tr-badge-soon" aria-disabled="true" title="Coming soon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#1C1C1C" xmlns="http://www.w3.org/2000/svg"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"></path></svg>
            App Store
          </span>
          <a href="https://play.google.com/store/apps/details?id=com.tuffyred.verbibrutali" class="tr-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#1C1C1C" xmlns="http://www.w3.org/2000/svg"><path d="M3.18 23.76a2 2 0 0 0 2.18-.22l12.3-7.1-2.68-2.68-11.8 10zM20.9 10.54L17.76 8.7l-3 2.99 3 3 3.17-1.85a1.83 1.83 0 0 0 0-3.3zM1.05.48A1.8 1.8 0 0 0 .75 1.5v21a1.8 1.8 0 0 0 .3 1.02l.09.08 11.76-11.76v-.28L1.14.4z"></path></svg>
            Google Play
          </a>
        </div>
      </div>
    </div>
    <div class="tr-footer">
      &copy; 2026 Tuffyred LLC &nbsp;&middot;&nbsp;<br>
      <a href="verbi-brutali/#privacy">Privacy Policy</a> &middot;<br>
      <a href="verbi-brutali/#terms">Terms of Service</a>
    </div>
  </div>
</body>
</html>
