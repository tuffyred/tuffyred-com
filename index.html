<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tuffyred.com</title>
  <meta name="description" content="Tuffyred LLC — apps that knock 'em dead.">
  <link rel="canonical" href="https://tuffyred.com/">
  <link rel="icon" href="assets/images/tuffyred-can-logo.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    .tr-home * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #ece3d1; }
    .tr-home {
      font-family: 'Inter', sans-serif;
      background: transparent;
      max-width: 680px;
      margin: 0 auto;
      padding: 3rem 1.5rem 4rem;
    }
    .tr-hero {
      display: flex;
      justify-content: center;
      padding-bottom: 3rem;
    }
    .tr-hero img {
      width: 260px;
      height: auto;
    }
    .tr-card {
      position: relative;
      display: flex;
      gap: 1.25rem;
      align-items: flex-start;
      border: 1px solid #ece3d3;
      border-radius: 18px;
      padding: 1.5rem 1.75rem;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(60,45,30,.08), 0 14px 30px -12px rgba(60,45,30,.24);
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .tr-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 2px 4px rgba(60,45,30,.06), 0 20px 40px -14px rgba(60,45,30,.26);
      border-color: #e2d4bd;
    }
    .tr-icon {
      width: 80px;
      height: 80px;
      border-radius: 18px;
      flex-shrink: 0;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(60,45,30,.22);
    }
    .tr-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .tr-app-name {
      font-family: 'Archivo Black', 'Arial Black', sans-serif;
      font-size: 18px;
      color: #1C1C1C;
      margin-bottom: 4px;
      text-decoration: none;
      display: inline-block;
    }
    .tr-app-name:hover { color: #C23B2C; }
    /* Stretch the app-name link over the whole card (card becomes one big link) */
    .tr-app-name::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 18px;
    }
    .tr-app-desc {
      font-size: 14px;
      color: #9A9384;
      line-height: 1.55;
      margin-bottom: 12px;
    }
    /* Raise badges above the stretched card link so they stay independently clickable */
    .tr-badges { position: relative; z-index: 1; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .tr-badge {
      display: inline-flex;
      border-radius: 8px;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(60,45,30,.18);
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    }
    .tr-badge img {
      display: block;
      height: 40px;
      width: auto;
      border-radius: 8px;
    }
    .tr-badge:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 14px rgba(60,45,30,.28);
      filter: brightness(1.08);
    }
    .tr-badge-soon { opacity: 0.4; cursor: default; box-shadow: none; }
    .tr-badge-soon:hover { transform: none; box-shadow: none; filter: none; }
    .tr-card + .tr-card { margin-top: 1.25rem; }
    .tr-footer {
      text-align: center;
      margin-top: 3rem;
      font-size: 12px;
      color: #9A9384;
    }
    .tr-footer a {
      color: #9A9384;
      text-decoration: none;
      margin: 0 6px;
    }
    .tr-footer a:hover { color: #C23B2C; }
  </style>
</head>
<body>
  <div class="tr-home">
    <div class="tr-hero">
      <img decoding="async" src="assets/images/tuffyred-can-logo.png" alt="Tuffyred — Knock 'Em Dead">
    </div>
    <div class="tr-card">
      <div class="tr-icon">
        <img decoding="async" src="assets/images/verbi-brutali-icon.png" alt="Verbi Brutali app icon">
      </div>
      <div>
        <a href="verbi-brutali/" class="tr-app-name">Verbi Brutali</a>
        <p class="tr-app-desc">Master Italian verb conjugations.</p>
        <div class="tr-badges">
          <a href="https://apps.apple.com/app/id6795999801" class="tr-badge">
            <img src="assets/badges/app-store.svg" alt="Download Verbi Brutali on the App Store">
          </a>
          <a href="https://play.google.com/store/apps/details?id=com.tuffyred.verbibrutali" class="tr-badge">
            <img src="assets/badges/google-play.svg" alt="Get Verbi Brutali on Google Play">
          </a>
        </div>
      </div>
    </div>
    <div class="tr-card">
      <div class="tr-icon">
        <img decoding="async" src="assets/images/verbos-matador-icon.png" alt="Verbos Matador app icon">
      </div>
      <div>
        <a href="verbos-matador/" class="tr-app-name">Verbos Matador</a>
        <p class="tr-app-desc">Master Spanish verb conjugations.</p>
        <div class="tr-badges">
          <a href="https://apps.apple.com/app/id6822895999" class="tr-badge">
            <img src="assets/badges/app-store.svg" alt="Download Verbos Matador on the App Store">
          </a>
          <a href="https://play.google.com/store/apps/details?id=com.tuffyred.verbosmatador" class="tr-badge">
            <img src="assets/badges/google-play.svg" alt="Get Verbos Matador on Google Play">
          </a>
        </div>
      </div>
    </div>
    <div class="tr-footer">
      &copy; 2026 Tuffyred LLC &nbsp;&middot;&nbsp;<br>
      <a href="verbi-brutali/#privacy">Verbi Brutali</a> &middot; <a href="verbos-matador/#privacy">Verbos Matador</a> &middot; Privacy &amp; Terms
    </div>
  </div>
</body>
</html>
