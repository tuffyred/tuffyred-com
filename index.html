<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tuffyred.com</title>
  <meta name="description" content="Tuffyred LLC — apps that knock 'em dead.">
  <link rel="canonical" href="https://tuffyred.com/">
  <link rel="icon" href="assets/images/tuffyred-can-logo.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    .tr-home * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #ffffff; }
    .tr-home {
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      max-width: 680px;
      margin: 0 auto;
      padding: 3rem 1.5rem 4rem;
    }
    .tr-hero {
      display: flex;
      justify-content: center;
      padding-bottom: 3rem;
    }
    .tr-hero img {
      width: 260px;
      height: auto;
    }
    .tr-card {
      display: flex;
      gap: 1.25rem;
      align-items: flex-start;
      border: 1px solid #e5e0d8;
      border-radius: 16px;
      padding: 1.25rem 1.5rem;
      background: #ffffff;
      cursor: pointer;
    }
    .tr-icon {
      width: 80px;
      height: 80px;
      border-radius: 18px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .tr-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .tr-app-name {
      font-family: 'Archivo Black', 'Arial Black', sans-serif;
      font-size: 18px;
      color: #1C1C1C;
      margin-bottom: 4px;
      text-decoration: none;
      display: inline-block;
    }
    .tr-app-name:hover { color: #C23B2C; }
    .tr-app-desc {
      font-size: 14px;
      color: #9A9384;
      line-height: 1.55;
    }
    .tr-footer {
      text-align: center;
      margin-top: 3rem;
      font-size: 12px;
      color: #9A9384;
    }
    .tr-footer a {
      color: #9A9384;
      text-decoration: none;
      margin: 0 6px;
    }
    .tr-footer a:hover { color: #C23B2C; }
  </style>
</head>
<body>
  <div class="tr-home">
    <div class="tr-hero">
      <img decoding="async" src="assets/images/tuffyred-can-logo.jpg" alt="Tuffyred — Knock 'Em Dead">
    </div>
    <div class="tr-card">
      <div class="tr-icon">
        <img decoding="async" src="assets/images/verbi-brutali-icon.png" alt="Verbi Brutali app icon">
      </div>
      <div>
        <a href="verbi-brutali/" class="tr-app-name">Verbi Brutali</a>
        <p class="tr-app-desc">Master Italian verb conjugations.</p>
      </div>
    </div>
    <div class="tr-footer">
      &copy; 2026 Tuffyred LLC &nbsp;&middot;&nbsp;<br>
      <a href="verbi-brutali/#privacy">Privacy Policy</a> &middot;<br>
      <a href="verbi-brutali/#terms">Terms of Service</a>
    </div>
  </div>
</body>
</html>
